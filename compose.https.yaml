# Optional public HTTPS reverse proxy. Set DOMAIN and BETTER_AUTH_URL consistently.
services:
  caddy:
    image: caddy:2-alpine
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.docker for HTTPS deployment}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  caddy-data:
  caddy-config:
